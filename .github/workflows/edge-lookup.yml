name: edge-lookup

on:
  push:
    paths:
      - "edge-lookup/**"
      - ".github/workflows/edge-lookup.yml"
  pull_request:
    paths:
      - "edge-lookup/**"
      - ".github/workflows/edge-lookup.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: edge-lookup

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["20.18.1", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: edge-lookup/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
